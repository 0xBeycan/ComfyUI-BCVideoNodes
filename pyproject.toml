[project]
name = "comfyui-bcvideonodes"
version = "0.2.0"
description = "ComfyUI video nodes: wholebody pose detection (ViTPose-H), SAM 3.1 person tracking, face crops and pose/mask guards for Wan Animate preprocessing, plus Wan Animate / Wan Animate 2 samplers that generate arbitrarily long videos by chaining fixed-size chunks."
authors = [{ name = "0xBeycan" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"

# torch, numpy, scipy, safetensors and tqdm come from the ComfyUI runtime (its own
# requirements.txt); pinning them here would risk conflicting with ComfyUI's versions.
# The models are native torch modules loaded from safetensors: onnx is not needed at runtime.
dependencies = ["opencv-python"]

[project.optional-dependencies]
# offline model conversion and upload (scripts/), and the tests
dev = ["pytest>=7.0", "onnx", "huggingface_hub"]

[project.urls]
Homepage = "https://github.com/0xBeycan/ComfyUI-BCVideoNodes"
Repository = "https://github.com/0xBeycan/ComfyUI-BCVideoNodes"
"Bug Tracker" = "https://github.com/0xBeycan/ComfyUI-BCVideoNodes/issues"

# ComfyUI Registry metadata (https://docs.comfy.org/registry/overview).
[tool.comfy]
PublisherId = "beycanai"
DisplayName = "ComfyUI-BCVideoNodes"
Icon = ""
